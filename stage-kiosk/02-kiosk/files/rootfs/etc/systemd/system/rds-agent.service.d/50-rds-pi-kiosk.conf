# RDS Pi Kiosk: rds-agent drives the screen only in RDS mode (MODE=rds in
# kiosk.txt, after Pair with RDS). In free mode the agent stays installed and
# paired but is not started; MODE=rds brings it straight back.
[Unit]
After=rds-kiosk-config.service rds-kiosk.service

[Service]
ExecCondition=/usr/lib/rds-pi-kiosk/mode-is rds
